
<div
  class="flex min-h-80 flex-col items-center justify-center
         rounded-2xl border border-slate-200
         bg-linear-to-b from-white to-slate-50
         px-6 py-12 text-center shadow-sm
         transition-all duration-300 hover:shadow-md">

  <!-- Empty state icon -->
  <div
    class="mb-6 flex h-20 w-20 items-center justify-center
           rounded-2xl border border-blue-100
           bg-blue-50 text-4xl font-light text-blue-600
           shadow-sm">
    +
  </div>

  <!-- Heading -->
  <h2 class="text-xl font-bold tracking-tight text-slate-900
             sm:text-2xl">
    No beneficiaries yet
  </h2>

  <!-- Description -->
  <p class="mt-3 max-w-sm text-sm leading-6 text-slate-500
            sm:text-base">
    You haven't added any beneficiaries. Add one to get started.
  </p>

  <!-- Add beneficiary button -->
  <button
    type="button"
    (click)="onAddBeneficiary()"
    class="mt-7 inline-flex items-center justify-center gap-2
           rounded-xl bg-blue-600 px-6 py-3
           text-sm font-semibold text-white
           shadow-md shadow-blue-600/20
           transition-all duration-200
           hover:-translate-y-0.5 hover:bg-blue-700
           hover:shadow-lg hover:shadow-blue-600/25
           focus:outline-none focus:ring-4
           focus:ring-blue-200
           active:translate-y-0">

    <span class="text-lg leading-none">+</span>
    <span>Add Beneficiary</span>
  </button>

</div>
