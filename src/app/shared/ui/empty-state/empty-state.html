
<div class="nb-empty-state" role="status">
  <div class="nb-empty-state__icon" aria-hidden="true">
    {{ icon }}
  </div>

  <h3 class="nb-empty-state__title">
    {{ title }}
  </h3>

  <p class="nb-empty-state__message">
    {{ message }}
  </p>

  @if (actionLabel) {
    <button
      type="button"
      class="btn"
      (click)="onAction()"
    >
      {{ actionLabel }}
    </button>
  }
</div>
